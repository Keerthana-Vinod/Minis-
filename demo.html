<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Product Assistant - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .query-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .analyze-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }

        .result-header {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .result-header::before {
            content: "🤖";
            margin-right: 10px;
            font-size: 1.5em;
        }

        .result-content {
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 1.05em;
        }

        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            color: #666;
            font-size: 0.9em;
        }

        .error {
            background: #fff5f5;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .quick-questions {
            margin-bottom: 20px;
        }

        .quick-question-btn {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: #e9ecef;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .quick-question-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍕 Food Product Assistant</h1>
        <p class="subtitle">Upload a food product image and ask any question!</p>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <label for="imageInput" class="upload-btn">
                    📷 Choose Product Image
                </label>
                <input type="file" id="imageInput" accept="image/jpeg,image/png">
            </div>
            <p style="margin-top: 15px; color: #666;">Supports: JPEG, PNG (Max 10MB)</p>
            <img id="imagePreview" alt="Preview">
        </div>

        <div class="query-section">
            <label for="queryInput">Your Question:</label>
            <input 
                type="text" 
                id="queryInput" 
                placeholder="e.g., What are the ingredients? Is this vegetarian?"
                value="What are the ingredients in this product?"
            >
            
            <div class="quick-questions">
                <p style="margin: 15px 0 10px 0; color: #666; font-size: 0.9em;">Quick questions:</p>
                <button class="quick-question-btn" onclick="setQuery('What are the ingredients?')">Ingredients</button>
                <button class="quick-question-btn" onclick="setQuery('Is this product vegetarian?')">Vegetarian?</button>
                <button class="quick-question-btn" onclick="setQuery('Does this contain allergens?')">Allergens</button>
                <button class="quick-question-btn" onclick="setQuery('What is the nutritional value?')">Nutrition</button>
                <button class="quick-question-btn" onclick="setQuery('Is this vegan?')">Vegan?</button>
            </div>
        </div>

        <button class="analyze-btn" onclick="analyzeProduct()" id="analyzeBtn">
            🔍 Analyze Product
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Analyzing your product...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result-section" id="result">
            <div class="result-header">AI Analysis</div>
            <div class="result-content" id="resultContent"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://minis.gokulp.online';
        let selectedFile = null;

        // Image preview
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        function setQuery(query) {
            document.getElementById('queryInput').value = query;
        }

        async function analyzeProduct() {
            const query = document.getElementById('queryInput').value;
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const analyzeBtn = document.getElementById('analyzeBtn');

            // Validation
            if (!selectedFile) {
                showError('Please select an image first!');
                return;
            }

            if (!query.trim()) {
                showError('Please enter a question!');
                return;
            }

            // Hide previous results
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';

            // Show loading
            loadingDiv.style.display = 'block';
            analyzeBtn.disabled = true;

            try {
                // Prepare form data
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('query', query);

                // Send request
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                // Show results
                document.getElementById('resultContent').textContent = data.response;
                document.getElementById('stats').innerHTML = `
                    ⏱️ Processing time: ${data.processing_time.toFixed(2)}s<br>
                    📅 Timestamp: ${new Date(data.timestamp).toLocaleString()}
                `;
                resultDiv.style.display = 'block';

            } catch (error) {
                showError(`Error: ${error.message}. Make sure the server is running at ${API_URL}`);
            } finally {
                loadingDiv.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Allow Enter key to submit
        document.getElementById('queryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeProduct();
            }
        });
    </script>
</body>
</html>
